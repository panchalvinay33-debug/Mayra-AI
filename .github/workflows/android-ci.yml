name: Android CI

on:
  push:
    branches: [main, phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup_artifacts:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run artifact cleanup via Android CI'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Actions artifacts created before 2026-08-12
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date('2026-08-12T00:00:00Z');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              if (new Date(artifact.created_at) < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                bytes += artifact.size_in_bytes || 0;
                if (deleted % 100 === 0) core.info(`Deleted ${deleted} artifacts...`);
              }
            }
            core.notice(`Deleted ${deleted} artifacts; requested storage cleanup ${(bytes / 1024 / 1024 / 1024).toFixed(2)} GiB.`);

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug sources
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace --console=plain

      - name: Test device action safety
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionSafetyTest' --console=plain

      - name: Test device action coordinator
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionCoordinatorTest' --console=plain

      - name: Test Android action specifications
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionSpecTest' --console=plain

      - name: Test Android action runtime
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionRunnerTest' --console=plain

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 1
