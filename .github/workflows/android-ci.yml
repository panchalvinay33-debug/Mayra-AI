name: Android CI

on:
  push:
    branches: [main, phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci
          gradle --no-daemon :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee build/ci/compile-debug.log

      - name: Test device action safety
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionSafetyTest' --stacktrace --console=plain 2>&1 | tee build/ci/device-action-safety.log

      - name: Test device action coordinator
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionCoordinatorTest' --stacktrace --console=plain 2>&1 | tee build/ci/device-action-coordinator.log

      - name: Test Android action specifications
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionSpecTest' --stacktrace --console=plain 2>&1 | tee build/ci/android-action-specifications.log

      - name: Test Android action runtime
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionRunnerTest' --stacktrace --console=plain 2>&1 | tee build/ci/android-action-runtime.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug --stacktrace --console=plain 2>&1 | tee build/ci/lint-debug.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            build/ci/
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: ignore
