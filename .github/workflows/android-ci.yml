name: Android CI

on:
  push:
    branches: [main, "agent/**", phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare CI diagnostics
        run: mkdir -p build/ci

      - name: Compile debug sources
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee build/ci/compile-debug.log

      - name: Run complete unit-test suite
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug :app:lintDocumentTest --stacktrace --console=plain 2>&1 | tee build/ci/lint.log

      - name: Assemble isolated document-test APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDocumentTest --stacktrace --console=plain 2>&1 | tee build/ci/assemble-document-test.log

      - name: Verify isolated APK manifest and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/documentTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/ci/document-test-permissions.log
          "$AAPT" dump badging "$APK" | tee build/ci/document-test-badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/ci/document-test-manifest-tree.log

          if grep -q '^uses-permission:' build/ci/document-test-permissions.log; then
            echo "Document-test APK unexpectedly requests Android permissions" >&2
            exit 1
          fi

          grep -Fq "package: name='ai.mayra.app.documenttest'" build/ci/document-test-badging.log
          grep -Fq "application-label:'Mayra Document Test'" build/ci/document-test-badging.log

          forbidden_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.MayraApplication
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
            androidx.startup.InitializationProvider
            androidx.work.impl.background.systemjob.SystemJobService
            androidx.work.impl.foreground.SystemForegroundService
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/ci/document-test-manifest-tree.log; then
              echo "Forbidden component found in isolated APK: $component" >&2
              exit 1
            fi
          done

          grep -Fq "ai.mayra.app.document.MayraDocumentActivity" build/ci/document-test-manifest-tree.log
          grep -Fq "ai.mayra.app.documenttest.DocumentTestApplication" build/ci/document-test-manifest-tree.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            build/ci/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-documentTest.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload isolated document-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-document-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/documentTest/*.apk
          if-no-files-found: error
          retention-days: 7
