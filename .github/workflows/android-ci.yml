name: Android CI

on:
  push:
    branches: [main, "agent/**", phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare CI diagnostics
        run: mkdir -p build/ci

      - name: Compile debug and full-test sources
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin :app:compileFullTestKotlin --stacktrace --console=plain 2>&1 | tee build/ci/compile.log

      - name: Run complete unit-test suite
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug :app:lintFullTest :app:lintDocumentTest --stacktrace --console=plain 2>&1 | tee build/ci/lint.log

      - name: Assemble full Mayra test APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleFullTest --stacktrace --console=plain 2>&1 | tee build/ci/assemble-full-test.log

      - name: Verify full Mayra test APK manifest and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/fullTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/ci/full-test-permissions.log
          "$AAPT" dump badging "$APK" | tee build/ci/full-test-badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/ci/full-test-manifest-tree.log

          grep -Fq "package: name='ai.mayra.app.fulltest'" build/ci/full-test-badging.log
          grep -Fq "application-label:'Mayra AI Full Test'" build/ci/full-test-badging.log
          grep -Fq "android.permission.RECORD_AUDIO" build/ci/full-test-permissions.log

          launcher_count="$(grep -c '^launchable-activity:' build/ci/full-test-badging.log || true)"
          if [ "$launcher_count" -ne 1 ]; then
            echo "Full-test APK must expose exactly one launchable activity; found $launcher_count" >&2
            exit 1
          fi
          grep -Fq "launchable-activity: name='ai.mayra.app.MainActivity'" build/ci/full-test-badging.log

          forbidden_permissions=(
            android.permission.READ_CONTACTS
            android.permission.CALL_PHONE
            android.permission.SEND_SMS
            android.permission.POST_NOTIFICATIONS
            android.permission.SCHEDULE_EXACT_ALARM
            android.permission.RECEIVE_BOOT_COMPLETED
            android.permission.INTERNET
          )
          for permission in "${forbidden_permissions[@]}"; do
            if grep -Fq "$permission" build/ci/full-test-permissions.log; then
              echo "Full-test APK unexpectedly requests: $permission" >&2
              exit 1
            fi
          done

          required_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.MayraApplication
            ai.mayra.app.document.MayraDocumentActivity
            ai.mayra.app.memory.MayraMemoryCenterActivity
            ai.mayra.app.core.MayraProviderSettingsActivity
            ai.mayra.app.core.MayraActivityHistoryActivity
          )
          for component in "${required_components[@]}"; do
            grep -Fq "$component" build/ci/full-test-manifest-tree.log
          done

          forbidden_components=(
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/ci/full-test-manifest-tree.log; then
              echo "High-risk background component found in full-test APK: $component" >&2
              exit 1
            fi
          done

      - name: Assemble isolated document-test APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDocumentTest --stacktrace --console=plain 2>&1 | tee build/ci/assemble-document-test.log

      - name: Verify isolated APK manifest and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/documentTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/ci/document-test-permissions.log
          "$AAPT" dump badging "$APK" | tee build/ci/document-test-badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/ci/document-test-manifest-tree.log

          if grep -q '^uses-permission:' build/ci/document-test-permissions.log; then
            echo "Document-test APK unexpectedly requests Android permissions" >&2
            exit 1
          fi

          grep -Fq "package: name='ai.mayra.app.documenttest'" build/ci/document-test-badging.log
          grep -Fq "application-label:'Mayra Document Test'" build/ci/document-test-badging.log

          forbidden_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.MayraApplication
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
            androidx.startup.InitializationProvider
            androidx.work.impl.background.systemjob.SystemJobService
            androidx.work.impl.foreground.SystemForegroundService
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/ci/document-test-manifest-tree.log; then
              echo "Forbidden component found in isolated APK: $component" >&2
              exit 1
            fi
          done

          grep -Fq "ai.mayra.app.document.MayraDocumentActivity" build/ci/document-test-manifest-tree.log
          grep -Fq "ai.mayra.app.core.MayraActivityHistoryActivity" build/ci/document-test-manifest-tree.log
          grep -Fq "ai.mayra.app.documenttest.DocumentTestApplication" build/ci/document-test-manifest-tree.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            build/ci/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-fullTest.html
            app/build/reports/lint-results-documentTest.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full Mayra test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-full-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/fullTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated document-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-document-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/documentTest/*.apk
          if-no-files-found: error
          retention-days: 7
