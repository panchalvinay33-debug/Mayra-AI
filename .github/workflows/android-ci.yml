name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - batch-12-runtime-control-center
      - stabilize/living-companion-v0.1
  pull_request:
    branches:
      - main
      - batch-12-runtime-control-center

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Environment diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ci
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "SHA: $GITHUB_SHA"
            echo "Runner: $RUNNER_NAME"
            echo "OS: $RUNNER_OS"
            echo "Architecture: $RUNNER_ARCH"
            java -version
            gradle --version
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            test -d "$ANDROID_HOME/platforms/android-35"
          } 2>&1 | tee build/ci/environment.log

      - name: Compile debug sources
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee build/ci/compile-debug.log

      - name: Test device action safety
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionSafetyTest' --stacktrace --console=plain 2>&1 | tee build/ci/device-action-safety.log

      - name: Test device action coordinator
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionCoordinatorTest' --stacktrace --console=plain 2>&1 | tee build/ci/device-action-coordinator.log

      - name: Test Android action specifications
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionSpecTest' --stacktrace --console=plain 2>&1 | tee build/ci/android-action-specifications.log

      - name: Test Android action runtime
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionRunnerTest' --stacktrace --console=plain 2>&1 | tee build/ci/android-action-runtime.log

      - name: Run complete unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build/ci/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:lintDebug --stacktrace --console=plain 2>&1 | tee build/ci/lint-debug.log

      - name: Build personal alpha APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --max-workers=2 :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build/ci/assemble-debug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build/ci/app-debug.sha256
          cp app/build/outputs/apk/debug/app-debug.apk "build/ci/Mayra-AI-personal-alpha-${GITHUB_SHA}.apk"
          {
            echo "source_sha=$GITHUB_SHA"
            echo "source_ref=$GITHUB_REF"
            echo "gradle=8.9"
            echo "jdk=17"
            echo "compile_sdk=35"
          } > build/ci/build-metadata.txt

      - name: Upload personal alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-personal-alpha-debug-${{ github.run_number }}
          path: |
            build/ci/Mayra-AI-personal-alpha-${{ github.sha }}.apk
            build/ci/app-debug.sha256
            build/ci/build-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            build/ci/
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14
