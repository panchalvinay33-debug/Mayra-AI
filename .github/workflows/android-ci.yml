name: Android CI

on:
  push:
    branches: [main, phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug sources
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace --console=plain

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Failed JVM test report details"
            find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print0 2>/dev/null \
              | xargs -0 grep -H -n -E '<failure|<error|testsuite .*failures="[1-9]' || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: ignore
