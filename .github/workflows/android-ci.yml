name: Android CI

on:
  push:
    branches: [main, "agent/**", phase-5-testing-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug sources
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace --console=plain

      - name: Test device action safety
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionSafetyTest' --console=plain

      - name: Test device action coordinator
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.DeviceActionCoordinatorTest' --console=plain

      - name: Test Android action specifications
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionSpecTest' --console=plain

      - name: Test Android action runtime
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'ai.mayra.app.core.actions.AndroidDeviceActionRunnerTest' --console=plain

      - name: Run complete unit-test suite
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace --console=plain

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
