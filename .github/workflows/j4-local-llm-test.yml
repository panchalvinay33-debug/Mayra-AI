name: J4 Local LLM Test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: j4-local-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 for J4-only LiteRT-LM packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch and verify pinned LiteRT-LM Android AAR without Maven transitives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/j4-runtime-probe app/libs
          VERSION="0.15.0"
          EXPECTED_SHA="b398c4745934a6035d192ffce5fdaf4f72a0009830a97b73c017c21f2a92b5bd"
          BASE="https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$VERSION"
          curl --fail --location --retry 3 "$BASE/litertlm-android-$VERSION.pom" -o build/j4-runtime-probe/litertlm-android.pom
          curl --fail --location --retry 3 "$BASE/litertlm-android-$VERSION.aar" -o build/j4-runtime-probe/litertlm-android.aar
          ACTUAL_SHA="$(sha256sum build/j4-runtime-probe/litertlm-android.aar | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "$ACTUAL_SHA  build/j4-runtime-probe/litertlm-android.aar" | tee build/j4-runtime-probe/aar-sha256.txt
          cp build/j4-runtime-probe/litertlm-android.aar app/libs/litertlm-android-0.15.0.aar
          echo "LiteRT-LM Android pinned release: $VERSION" | tee build/j4-runtime-probe/version.txt
          python3 - <<'PY' | tee build/j4-runtime-probe/classfile-probe.txt
          import io, struct, zipfile
          aar=zipfile.ZipFile('build/j4-runtime-probe/litertlm-android.aar')
          classes=zipfile.ZipFile(io.BytesIO(aar.read('classes.jar')))
          name='com/google/ai/edge/litertlm/Engine.class'
          data=classes.read(name)
          magic, minor, major=struct.unpack('>IHH', data[:8])
          assert magic == 0xCAFEBABE
          assert major == 65, f'Expected Java 21 classfile 65, got {major}'
          print(f'class={name}')
          print(f'classfile_major={major}')
          print('required_jdk=21')
          PY
          unzip -l build/j4-runtime-probe/litertlm-android.aar | tee build/j4-runtime-probe/aar-contents.txt

      - name: Prove Maven Kotlin transitives are absent from J4 compile classpath
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/j4-ci
          gradle --no-daemon :app:dependencies --configuration j4LocalLlmTestCompileClasspath --console=plain | tee build/j4-ci/compile-classpath.txt
          if grep -Fq 'com.google.ai.edge.litertlm:litertlm-android' build/j4-ci/compile-classpath.txt; then
            echo 'LiteRT Maven module leaked onto J4 compile classpath' >&2
            exit 1
          fi
          if grep -Fq 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21' build/j4-ci/compile-classpath.txt; then
            echo 'Kotlin 2.2.21 leaked onto J4 compile classpath' >&2
            exit 1
          fi

      - name: Compile, test and lint J4 with local-AAR runtime isolation
        run: |
          gradle --no-daemon \
            :app:compileJ4LocalLlmTestJavaWithJavac \
            :app:compileJ4LocalLlmTestKotlin \
            :app:testDebugUnitTest --tests 'ai.mayra.app.localmodel.MayraLocalModelIntegrityTest' --tests 'ai.mayra.app.learning.MayraSelfLearningPolicyTest' \
            :app:lintJ4LocalLlmTest \
            --stacktrace --console=plain

      - name: Assemble J4 APK with local LiteRT-LM runtime
        run: gradle --no-daemon :app:assembleJ4LocalLlmTest --stacktrace --console=plain

      - name: Audit zero-permission and isolated LiteRT runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/j4LocalLlmTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/j4-ci/permissions.log
          "$AAPT" dump badging "$APK" | tee build/j4-ci/badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/j4-ci/manifest.log
          unzip -l "$APK" | tee build/j4-ci/apk-contents.log

          permission_count="$(grep -c '^uses-permission:' build/j4-ci/permissions.log || true)"
          test "$permission_count" -eq 0
          grep -Fq "package: name='ai.mayra.app.j4'" build/j4-ci/badging.log
          grep -Fq "application-label:'Mayra J4 Local Brain Test'" build/j4-ci/badging.log
          launcher_count="$(grep -c '^launchable-activity:' build/j4-ci/badging.log || true)"
          test "$launcher_count" -eq 1
          grep -Fq "launchable-activity: name='ai.mayra.app.j4.J4LocalLlmTestActivity'" build/j4-ci/badging.log

          required_components=(
            ai.mayra.app.j4.J4TestApplication
            ai.mayra.app.j4.J4LocalLlmTestActivity
            ai.mayra.app.j4.J4LocalBrainRuntimeService
          )
          for component in "${required_components[@]}"; do
            grep -Fq "$component" build/j4-ci/manifest.log
          done
          grep -Fq ':localbrain' build/j4-ci/manifest.log

          forbidden_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.assistant.MayraVoiceInteractionService
            ai.mayra.app.assistant.MayraVoiceInteractionSessionService
            ai.mayra.app.assistant.MayraRecognitionService
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
            ai.mayra.app.reminder.MayraReminderActionReceiver
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/j4-ci/manifest.log; then
              echo "Unexpected component in J4 Local LLM Test: $component" >&2
              exit 1
            fi
          done

          grep -Fq 'lib/arm64-v8a/liblitertlm_jni.so' build/j4-ci/apk-contents.log
          sha256sum "$APK" | tee build/j4-ci/apk-sha256.txt
          stat --printf='APK bytes: %s\n' "$APK" | tee build/j4-ci/apk-size.txt

      - name: Upload J4 runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j4-litert-runtime-apk-${{ github.run_number }}
          path: app/build/outputs/apk/j4LocalLlmTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload J4 audit and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j4-litert-runtime-audit-${{ github.run_number }}
          path: |
            build/j4-ci/
            build/j4-runtime-probe/
            app/build/reports/lint-results-j4LocalLlmTest.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
