name: J1 Assistant Test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: j1-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile and lint J1 test
        run: gradle --no-daemon :app:compileJ1AssistantTestKotlin :app:lintJ1AssistantTest --stacktrace --console=plain

      - name: Assemble J1 test APK
        run: gradle --no-daemon :app:assembleJ1AssistantTest --stacktrace --console=plain

      - name: Audit zero-permission assistant boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/j1-ci
          APK="$(find app/build/outputs/apk/j1AssistantTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/j1-ci/permissions.log
          "$AAPT" dump badging "$APK" | tee build/j1-ci/badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/j1-ci/manifest.log

          if grep -q '^uses-permission:' build/j1-ci/permissions.log; then
            echo "J1 Assistant Test must request zero Android permissions" >&2
            exit 1
          fi

          grep -Fq "package: name='ai.mayra.app.j1'" build/j1-ci/badging.log
          grep -Fq "application-label:'Mayra J1 Assistant Test'" build/j1-ci/badging.log

          launcher_count="$(grep -c '^launchable-activity:' build/j1-ci/badging.log || true)"
          test "$launcher_count" -eq 1
          grep -Fq "launchable-activity: name='ai.mayra.app.j1.J1AssistantTestActivity'" build/j1-ci/badging.log

          required_components=(
            ai.mayra.app.j1.J1TestApplication
            ai.mayra.app.j1.J1AssistantTestActivity
            ai.mayra.app.assistant.MayraVoiceInteractionService
            ai.mayra.app.assistant.MayraVoiceInteractionSessionService
            ai.mayra.app.assistant.MayraRecognitionService
          )
          for component in "${required_components[@]}"; do
            grep -Fq "$component" build/j1-ci/manifest.log
          done

          forbidden_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.MayraApplication
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
            ai.mayra.app.reminder.MayraReminderActionReceiver
            ai.mayra.app.document.MayraDocumentActivity
            ai.mayra.app.memory.MayraMemoryCenterActivity
            ai.mayra.app.core.MayraProviderSettingsActivity
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/j1-ci/manifest.log; then
              echo "Unexpected component in J1 Assistant Test: $component" >&2
              exit 1
            fi
          done

      - name: Upload J1 APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j1-zero-permission-apk-${{ github.run_number }}
          path: app/build/outputs/apk/j1AssistantTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload J1 audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j1-audit-${{ github.run_number }}
          path: |
            build/j1-ci/
            app/build/reports/lint-results-j1AssistantTest.html
          if-no-files-found: warn
          retention-days: 7
