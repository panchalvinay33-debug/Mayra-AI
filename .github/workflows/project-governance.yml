name: Project Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**", phase-5-testing-foundation]

permissions:
  contents: read
  actions: write

concurrency:
  group: mayra-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-actions-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete all existing Actions artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            let bytes = 0;
            let failed = 0;
            core.notice(`Found ${artifacts.length} artifacts to clean.`);
            for (const artifact of artifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                bytes += artifact.size_in_bytes || 0;
                if (deleted % 100 === 0) core.info(`Deleted ${deleted}/${artifacts.length}`);
              } catch (error) {
                failed += 1;
                core.warning(`Failed ${artifact.id}: ${error.message}`);
              }
            }
            core.notice(`Deleted ${deleted} artifacts; failures ${failed}; cleanup ${(bytes / 1024 / 1024 / 1024).toFixed(2)} GiB.`);

  verify-project-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify canonical project records
        shell: bash
        run: bash scripts/verify_project_governance.sh "${{ steps.refs.outputs.base }}" HEAD

      - name: Upload governance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-governance-${{ github.run_number }}
          path: build-governance-changed-files.txt
          if-no-files-found: warn
          retention-days: 1
