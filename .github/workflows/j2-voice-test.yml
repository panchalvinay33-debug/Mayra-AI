name: J2 Voice Test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: j2-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile, unit test and lint J2 voice test
        run: gradle --no-daemon :app:compileJ2VoiceTestKotlin :app:testJ2VoiceTestUnitTest :app:lintJ2VoiceTest --stacktrace --console=plain

      - name: Assemble J2 voice test APK
        run: gradle --no-daemon :app:assembleJ2VoiceTest --stacktrace --console=plain

      - name: Audit one-permission voice boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/j2-ci
          APK="$(find app/build/outputs/apk/j2VoiceTest -name '*.apk' -type f | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$AAPT"

          "$AAPT" dump permissions "$APK" | tee build/j2-ci/permissions.log
          "$AAPT" dump badging "$APK" | tee build/j2-ci/badging.log
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee build/j2-ci/manifest.log

          permission_count="$(grep -c '^uses-permission:' build/j2-ci/permissions.log || true)"
          if [ "$permission_count" -ne 1 ]; then
            echo "J2 Voice Test must request exactly one Android permission; found $permission_count" >&2
            exit 1
          fi
          grep -Fq "android.permission.RECORD_AUDIO" build/j2-ci/permissions.log

          forbidden_permissions=(
            android.permission.INTERNET
            android.permission.READ_CONTACTS
            android.permission.POST_NOTIFICATIONS
            android.permission.RECEIVE_BOOT_COMPLETED
            android.permission.WAKE_LOCK
            android.permission.ACCESS_NETWORK_STATE
            android.permission.FOREGROUND_SERVICE
            android.permission.CALL_PHONE
            android.permission.SEND_SMS
          )
          for permission in "${forbidden_permissions[@]}"; do
            if grep -Fq "$permission" build/j2-ci/permissions.log; then
              echo "Unexpected permission in J2 Voice Test: $permission" >&2
              exit 1
            fi
          done

          grep -Fq "package: name='ai.mayra.app.j2'" build/j2-ci/badging.log
          grep -Fq "application-label:'Mayra J2 Voice Test'" build/j2-ci/badging.log

          launcher_count="$(grep -c '^launchable-activity:' build/j2-ci/badging.log || true)"
          test "$launcher_count" -eq 1
          grep -Fq "launchable-activity: name='ai.mayra.app.j2.J2VoiceTestActivity'" build/j2-ci/badging.log

          required_components=(
            ai.mayra.app.j2.J2TestApplication
            ai.mayra.app.j2.J2VoiceTestActivity
            ai.mayra.app.assistant.MayraVoiceInteractionService
            ai.mayra.app.assistant.MayraVoiceInteractionSessionService
            ai.mayra.app.assistant.MayraRecognitionService
          )
          for component in "${required_components[@]}"; do
            grep -Fq "$component" build/j2-ci/manifest.log
          done

          forbidden_components=(
            ai.mayra.app.MainActivity
            ai.mayra.app.MayraApplication
            ai.mayra.app.background.MayraNotificationListener
            ai.mayra.app.background.MayraBootReceiver
            ai.mayra.app.reminder.MayraReminderActionReceiver
            ai.mayra.app.document.MayraDocumentActivity
            ai.mayra.app.memory.MayraMemoryCenterActivity
            ai.mayra.app.core.MayraProviderSettingsActivity
            androidx.startup.InitializationProvider
            androidx.work.impl.background.systemjob.SystemJobService
            androidx.work.impl.foreground.SystemForegroundService
            androidx.work.impl.utils.ForceStopRunnable\$BroadcastReceiver
            androidx.work.impl.background.systemalarm.RescheduleReceiver
            androidx.work.impl.diagnostics.DiagnosticsReceiver
            androidx.room.MultiInstanceInvalidationService
            androidx.profileinstaller.ProfileInstallReceiver
          )
          for component in "${forbidden_components[@]}"; do
            if grep -Fq "$component" build/j2-ci/manifest.log; then
              echo "Unexpected component in J2 Voice Test: $component" >&2
              exit 1
            fi
          done

      - name: Upload J2 APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j2-voice-apk-${{ github.run_number }}
          path: app/build/outputs/apk/j2VoiceTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload J2 audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayra-j2-audit-${{ github.run_number }}
          path: |
            build/j2-ci/
            app/build/reports/lint-results-j2VoiceTest.html
            app/build/reports/tests/testJ2VoiceTestUnitTest/
          if-no-files-found: warn
          retention-days: 7
